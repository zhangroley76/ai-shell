[package]
name = "ai-shell"
version = "1.0.0"
edition = "2021"
description = "A local-first, privacy-friendly natural-language Linux command assistant powered by LLMs"
authors = ["roley zhang"]
license = "MIT"
repository = "https://github.com/zhangroley76/ai-shell"
readme = "README.md"
keywords = ["cli", "llm", "shell", "ollama", "assistant"]
categories = ["command-line-utilities"]

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
